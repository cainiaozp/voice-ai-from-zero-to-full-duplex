name: Validate course structure
on:
  push:
  pull_request:
jobs:
  static-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check Python syntax and essential files
        run: python scripts/verify_repo.py
